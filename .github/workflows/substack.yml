# Once a day (and on every push), refresh posts.json from Substack.
# Commits only when the list actually changed, so the history stays quiet.
name: Update Substack posts

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  push:
    branches: [main]
    paths-ignore: [posts.json]  # don't react to our own commit
  workflow_dispatch:            # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_substack.py
      - name: Commit posts.json if it changed
        run: |
          if git diff --quiet -- posts.json; then
            echo "No new posts."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts.json
            git commit -m "Update Substack posts"
            git push
          fi
